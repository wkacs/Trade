name: hourly-tick

# Óránként meghívja a Vercel /api/cron/tick endpointot — így a (napi limites Hobby)
# Vercel cron helyett óránként fut a tick. A CRON_SECRET a repo Secrets-ből jön.
# A GitHub ütemezett workflow a DEFAULT branch-en (master) fut, és ~60 nap commit-mentes
# inaktivitás után letiltódik (egy commit újraaktiválja).
on:
  schedule:
    - cron: "7 * * * *" # minden óra :07-kor (UTC)
  workflow_dispatch: {} # kézi indítás is a GitHub UI-ról

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger tick
        run: |
          curl -fsS -X POST "https://trade-beryl-six.vercel.app/api/cron/tick" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -w "\nHTTP %{http_code}\n"
