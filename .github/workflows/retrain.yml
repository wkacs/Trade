name: weekly-retrain

# Heti ML-újratanítás a legfrissebb Binance-adaton (regime-adaptáció).
#
# T13 VÁLTOZÁS: a workflow SOHA nem cseréli le automatikusan az aktív modellt.
# A régi kapu ("test AUC >= 0.5") csak azt jelentette, hogy a modell nem rosszabb a
# véletlennél — ez nem bizonyított előny, és nem elég egy éles döntéshozó cseréjéhez.
#
# Amit a workflow csinál: betanít egy JELÖLTET (model.candidate.json), kiírja a
# promóciós értékelést, és artefaktumként feltölti. A LÉPTETÉS KÉZI DÖNTÉS.
on:
  schedule:
    - cron: "0 6 * * 1" # minden hétfő 06:00 UTC
  workflow_dispatch: {} # kézi indítás is

permissions:
  contents: read

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Jelölt modell betanítása (az aktív modell ÉRINTETLEN)
        run: pnpm tsx scripts/train-model.ts | tee retrain-report.txt

      - name: A jelölt és a jelentés feltöltése
        uses: actions/upload-artifact@v4
        with:
          name: model-candidate
          path: |
            src/lib/ml/model.candidate.json
            retrain-report.txt
          retention-days: 30

      - name: Az aktív modell változatlanságának ellenőrzése
        run: |
          if ! git diff --quiet src/lib/ml/model.json; then
            echo "::error::Az aktív model.json megváltozott — a tréning nem írhatja felül."
            exit 1
          fi
          echo "Az aktív model.json változatlan. A jelölt léptetése kézi döntés:"
          echo "  1) töltsd le a model-candidate artefaktumot"
          echo "  2) nézd meg a retrain-report.txt promóciós értékelését"
          echo "  3) ha elfogadod: cp model.candidate.json src/lib/ml/model.json és commit"
